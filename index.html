<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="duo-bg">
            <div class="fruit-app-card">
                <h1 class="duo-title">Kawaii Fruit Shop</h1>
                <p class="duo-intro">Order your favorite fruits in kawaii style!</p>
                <div class="fruit-list">
                    <div class="fruit-card">
                        <img src="pineapple.avif" alt="Pineapple" class="fruit-img">
                        <div class="fruit-name">Pineapple</div>
                        <button class="add-cart-btn">Add to Cart</button>
                    </div>
                    <div class="fruit-card">
                        <img src="coconut.svg" alt="Coconut" class="fruit-img">
                        <div class="fruit-name">Coconut</div>
                        <button class="add-cart-btn">Add to Cart</button>
                    </div>
                    <div class="fruit-card">
                        <img src="watermelon.svg" alt="Watermelon" class="fruit-img">
                        <div class="fruit-name">Watermelon</div>
                        <button class="add-cart-btn">Add to Cart</button>
                    </div>
                    <div class="fruit-card">
                        <img src="melon.svg" alt="Melon" class="fruit-img">
                        <div class="fruit-name">Melon</div>
                        <button class="add-cart-btn">Add to Cart</button>
                    </div>
                    <div class="fruit-card">
                        <img src="orange.svg" alt="Orange" class="fruit-img">
                        <div class="fruit-name">Orange</div>
                        <button class="add-cart-btn">Add to Cart</button>
                    </div>
                    <div class="fruit-card">
                        <img src="kiwi.svg" alt="Kiwi" class="fruit-img">
                        <div class="fruit-name">Kiwi</div>
                        <button class="add-cart-btn">Add to Cart</button>
                    </div>
                    <div class="fruit-card">
                        <img src="banana.svg" alt="Banana" class="fruit-img">
                        <div class="fruit-name">Banana</div>
                        <button class="add-cart-btn">Add to Cart</button>
                    </div>
                </div>
                <div class="cart-area">
                    <h2>🛒 Cart</h2>
                    <ul class="cart-list">
                        <!-- Cart items will appear here (UI only) -->
                    </ul>
                </div>
            </div>
        </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="cart-overlay" class="cart-overlay"></div>
    <nav class="vertical-menu">
        <ul>
            <li class="menu-item selected">Order</li>
            <li class="menu-item">Create</li>
            <li class="menu-item">Profile</li>
            <li class="menu-item">Settings</li>
        </ul>
    </nav>
    <div class="background-fruit-container">
        <img src="ananas.png" class="bg-fruit bg-fruit-1" alt="Pineapple">
        <img src="kiwi.png" class="bg-fruit bg-fruit-2" alt="Kiwi">
        <img src="fruit.png" class="bg-fruit bg-fruit-3" alt="Orange">
        <img src="ananas.png" class="bg-fruit bg-fruit-4" alt="Pineapple">
        <img src="kiwi.png" class="bg-fruit bg-fruit-5" alt="Kiwi">
        <img src="fruit.png" class="bg-fruit bg-fruit-6" alt="Orange">
        <img src="ananas.png" class="bg-fruit bg-fruit-7" alt="Pineapple">
        <img src="kiwi.png" class="bg-fruit bg-fruit-8" alt="Kiwi">
        <img src="fruit.png" class="bg-fruit bg-fruit-9" alt="Orange">
    </div>
    <div class="duo-bg">
        <div class="fruit-app-card">
            <h1 class="duo-title">Kawaii Fruit Shop</h1>
            <p class="duo-intro">Order your favorite fruits in kawaii style!</p>
            <div class="fruit-list">
                <div class="fruit-card">
                    <img src="ananas.png" alt="Pineapple" class="fruit-img">
                    <div class="fruit-name">Pineapple</div>
                    <button class="add-cart-btn">Add to Cart</button>
                </div>
                <div class="fruit-card">
                    <img src="kiwi.png" alt="Kiwi" class="fruit-img">
                    <div class="fruit-name">Kiwi</div>
                    <button class="add-cart-btn">Add to Cart</button>
                </div>
                <div class="fruit-card">
                    <img src="fruit.png" alt="Orange" class="fruit-img">
                    <div class="fruit-name">Orange</div>
                    <button class="add-cart-btn">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
    <div class="cart-drawer" id="cart-area">
        <div class="profile-in-drawer">
            <img src="llama.jpg" alt="Profile Photo" class="profile-photo">
            <div class="profile-details">
                <div class="profile-name">Kawaii Llama</div>
                <div class="profile-email">llama@fruitshop.com</div>
            </div>
            <button class="profile-logout-outline">Log Out</button>
        </div>
        <h2>🛒 Cart</h2>
        <ul class="cart-list" id="cart-list">
            <!-- Cart items will appear here (UI only) -->
        </ul>
    </div>
</body>
<style>
    .cart-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.18);
        z-index: 1999;
        transition: opacity 0.3s;
    }
    .cart-overlay.open {
        display: block;
    }
    .vertical-menu {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 170px;
        background: rgba(255,255,255,0.97);
        box-shadow: 2px 0 16px rgba(30,60,114,0.08);
        z-index: 2100;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding-top: 48px;
    }
    .vertical-menu ul {
        list-style: none;
        padding: 0;
        margin: 0;
        width: 100%;
    }
    .vertical-menu .menu-item {
        font-family: 'Baloo 2', Arial, sans-serif;
        font-size: 1.15rem;
        color: #58cc02;
        padding: 16px 32px 16px 32px;
        cursor: pointer;
        border-radius: 0 24px 24px 0;
        margin-bottom: 8px;
        transition: background 0.2s, color 0.2s;
        font-weight: 600;
        letter-spacing: 0.2px;
        background: none;
        border: none;
        outline: none;
        display: block;
    }
    .vertical-menu .menu-item.selected {
        background: #e5f9e0;
        color: #1cb0f6;
        box-shadow: 2px 0 8px rgba(30,60,114,0.06);
    }
    .vertical-menu .menu-item:hover:not(.selected) {
        background: #f7ffe6;
        color: #ff5a5f;
    }
    /* Push main content to the right to make space for menu */
    .duo-bg, .cart-drawer {
        margin-left: 170px;
    }
    @media (max-width: 700px) {
        .vertical-menu {
            width: 60px;
            padding-top: 24px;
        }
        .vertical-menu .menu-item {
            font-size: 0.95rem;
            padding: 12px 8px 12px 8px;
            border-radius: 0 16px 16px 0;
        }
        .duo-bg, .cart-drawer {
            margin-left: 60px;
        }
    }
    .profile-in-drawer {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        padding: 0 0 8px 0;
        border-bottom: 1px solid #e5f9e0;
    }
    .profile-photo {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #58cc02;
        box-shadow: 0 1px 6px rgba(88,204,2,0.10);
        background: #fff;
    }
    .profile-details {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        flex: 1;
    }
    .profile-name {
        font-family: 'Baloo 2', Arial, sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        color: #58cc02;
    }
    .profile-email {
        font-size: 0.92rem;
        color: #888;
    }
    .profile-logout-outline {
        background: transparent;
        color: #58cc02;
        border: 2px solid #58cc02;
        border-radius: 16px;
        padding: 3px 16px;
        font-size: 0.92rem;
        font-family: 'Baloo 2', Arial, sans-serif;
        font-weight: 700;
        cursor: pointer;
        box-shadow: none;
        transition: background 0.2s, color 0.2s;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .profile-logout-outline:hover {
        background: #e5f9e0;
        color: #1cb0f6;
        border-color: #1cb0f6;
    }
    .background-fruit-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
    }
    .bg-fruit {
        position: absolute;
        opacity: 0.13;
        filter: blur(0.5px) saturate(1.2);
        pointer-events: none;
        animation: float-fruit 8s ease-in-out infinite;
        will-change: transform;
    }
    .bg-fruit-1 { left: 8vw; top: 12vh; width: 120px; animation-delay: 0s; }
    .bg-fruit-2 { right: 10vw; top: 30vh; width: 90px; animation-delay: 2s; }
    .bg-fruit-3 { left: 50vw; bottom: 10vh; width: 100px; animation-delay: 4s; }
    .bg-fruit-4 { left: 20vw; top: 60vh; width: 80px; animation-delay: 1s; }
    .bg-fruit-5 { right: 18vw; top: 18vh; width: 60px; animation-delay: 3s; }
    .bg-fruit-6 { left: 60vw; bottom: 18vh; width: 100px; animation-delay: 5s; }
    .bg-fruit-7 { left: 30vw; top: 35vh; width: 70px; animation-delay: 2.5s; }
    .bg-fruit-8 { right: 25vw; bottom: 25vh; width: 80px; animation-delay: 4.5s; }
    .bg-fruit-9 { left: 75vw; top: 15vh; width: 90px; animation-delay: 6s; }
    @keyframes float-fruit {
        0%   { transform: translateY(0px) scale(1) rotate(-8deg); }
        25%  { transform: translateY(-18px) scale(1.04) rotate(2deg); }
        50%  { transform: translateY(0px) scale(1.02) rotate(-4deg); }
        75%  { transform: translateY(12px) scale(1.01) rotate(6deg); }
        100% { transform: translateY(0px) scale(1) rotate(-8deg); }
    }
    .flying-img {
        position: fixed;
        z-index: 1000;
        pointer-events: none;
        will-change: transform, opacity;
        animation: fly-to-cart 4s cubic-bezier(.4,2,.6,1) forwards;
    }
    @keyframes fly-to-cart {
        0% { opacity: 1; transform: translate(0, 0) scale(1);}
        40% { transform: translate(var(--dx-curve, 0px), calc(var(--dy, 0px) * 0.3 - 60px)) scale(1.1) rotate(-12deg);}
        70% { transform: translate(calc(var(--dx, 0px) * 0.7), calc(var(--dy, 0px) * 0.7 - 20px)) scale(0.7) rotate(8deg);}
        100% { opacity: 0.2; transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(0.3) rotate(0deg);}
    }
    .cart-drawer {
        position: fixed;
        top: 0;
        right: 0;
        width: 320px;
        height: 100vh;
        background: rgba(255,255,255,0.92);
        box-shadow: -4px 0 24px rgba(30,60,114,0.10);
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
        padding: 32px 24px 24px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2000;
        transition: box-shadow 0.2s, transform 0.5s cubic-bezier(.4,1.4,.6,1), opacity 0.5s;
        backdrop-filter: blur(8px);
        transform: translateX(100%);
        opacity: 0;
        pointer-events: none;
    }
    .cart-drawer.open {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
    }
    .cart-drawer h2 {
        font-family: 'Baloo 2', Arial, sans-serif;
        color: #58cc02;
        font-size: 1.3rem;
        margin: 0 0 24px 0;
        text-align: left;
        width: 100%;
        padding-left: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .cart-list {
        list-style: none;
        padding: 0;
        margin: 0;
        min-height: 32px;
        color: #333;
        font-size: 1.1rem;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
    }
    .cart-fruit-card {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 2px 12px rgba(88,204,2,0.10);
        padding: 16px 0 16px 16px;
        display: flex;
        align-items: center;
        gap: 18px;
        width: calc(100% - 48px);
        margin: 0 24px;
        min-height: 70px;
        max-width: 400px;
        position: relative;
        justify-content: flex-start;
    }
    .cart-fruit-img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #e5f9e0;
        box-shadow: 0 1px 4px rgba(88,204,2,0.10);
    }
    .cart-fruit-name {
        font-family: 'Baloo 2', Arial, sans-serif;
        font-size: 1.1rem;
        color: #58cc02;
        font-weight: 700;
        text-align: left;
    }
    .cart-remove-btn {
        background: #fff;
        border: none;
        color: #ff5a5f;
        font-size: 1.5rem;
        font-weight: bold;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        margin-left: auto;
        margin-right: 8px;
        transition: background 0.2s, color 0.2s;
        box-shadow: 0 1px 4px rgba(255,90,95,0.08);
    }
    .cart-remove-btn:hover {
        background: #ffeaea;
        color: #d90429;
    }
</style>
<script>
// Overlay and click-outside-to-close logic for cart drawer
const cartOverlay = document.getElementById('cart-overlay');
function openCartDrawer() {
    cartDrawer.classList.add('open');
    cartOverlay.classList.add('open');
}
function closeCartDrawer() {
    cartDrawer.classList.remove('open');
    cartOverlay.classList.remove('open');
}
cartOverlay.addEventListener('click', closeCartDrawer);

// Helper to get the cart area position
function getCartPosition() {
    const cart = document.getElementById('cart-area');
    const rect = cart.getBoundingClientRect();
    return {
        x: rect.left + rect.width / 2,
        y: rect.top + 10 // top of cart area
    };
}

// Add to Cart animation and UI logic
const cartDrawer = document.getElementById('cart-area');
document.querySelectorAll('.add-cart-btn').forEach((btn) => {
    btn.addEventListener('click', function() {
        // Open the cart drawer (with overlay)
        openCartDrawer();

        const card = btn.closest('.fruit-card');
        const img = card.querySelector('.fruit-img');
        const imgRect = img.getBoundingClientRect();
        const cartPos = getCartPosition();

        // Add a delay before flying the fruit (e.g., 350ms)
        setTimeout(() => {
            // Clone the image
            const flyingImg = img.cloneNode(true);
            flyingImg.classList.add('flying-img');
            document.body.appendChild(flyingImg);
            // Set initial position
            flyingImg.style.left = imgRect.left + 'px';
            flyingImg.style.top = imgRect.top + 'px';
            flyingImg.style.width = imgRect.width + 'px';
            flyingImg.style.height = imgRect.height + 'px';
            flyingImg.style.transform = 'none';

            // Calculate curve for more organic path
            const dx = cartPos.x - (imgRect.left + imgRect.width/2);
            const dy = cartPos.y - (imgRect.top + imgRect.height/2);
            // Add a little curve to the right or left randomly
            const dxCurve = dx + (Math.random() > 0.5 ? 80 : -80);
            flyingImg.style.setProperty('--dx', dx + 'px');
            flyingImg.style.setProperty('--dy', dy + 'px');
            flyingImg.style.setProperty('--dx-curve', dxCurve + 'px');

            // Add to cart UI (add card with image and name) immediately
            const fruitName = card.querySelector('.fruit-name').textContent;
            const fruitImgSrc = img.getAttribute('src');
            const fruitImgAlt = img.getAttribute('alt');
            const cartList = document.getElementById('cart-list');
            const li = document.createElement('li');
            li.className = 'cart-fruit-card';
            li.innerHTML = `<img src=\"${fruitImgSrc}\" alt=\"${fruitImgAlt}\" class=\"cart-fruit-img\"><span class=\"cart-fruit-name\">${fruitName}</span><button class=\"cart-remove-btn\" title=\"Remove\">&times;</button>`;
            cartList.appendChild(li);

            // Remove flying image after animation
            setTimeout(() => {
                flyingImg.remove();
            }, 4000);
        }, 350);
    });
});

// Remove from cart logic
const cartListEl = document.getElementById('cart-list');
cartListEl.addEventListener('click', function(e) {
    if (e.target.classList.contains('cart-remove-btn')) {
        const li = e.target.closest('.cart-fruit-card');
        if (li) li.remove();
    }
});
</script>
</html>
